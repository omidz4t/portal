name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags="-s -w" \
            -o "tgportal-${GOOS}-${GOARCH}${ext}" \
            ./cmd/tgportal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgportal-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tgportal-*
          if-no-files-found: error
          retention-days: 14

  # On main only: bump VERSION from conventional commits, then tag.
  # The tag workflow publishes binaries. Skips chore(release) commits.
  release:
    name: Version bump
    needs: test
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      bumped: ${{ steps.version.outputs.bumped }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false
          git config tag.gpgsign false

      - name: Bump from conventional commits
        id: version
        run: bash scripts/bump-version.sh --commit --tag --changelog --skip-ci

      - name: Push commit and tag
        if: steps.version.outputs.bumped == 'true'
        run: |
          git push origin HEAD:main
          git push origin "${{ steps.version.outputs.tag }}"

      # GITHUB_TOKEN tag pushes do not start other workflows — publish here.
      - name: Set up Go
        if: steps.version.outputs.bumped == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release archives
        if: steps.version.outputs.bumped == 'true'
        env:
          CGO_ENABLED: "0"
        run: make build-release-all VERSION="${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.version.outputs.bumped == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TGPORTAL ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### Version"
            echo ""
            echo "- bump: \`${{ steps.version.outputs.bumped }}\`"
            echo "- version: \`${{ steps.version.outputs.version }}\`"
            echo "- tag: \`${{ steps.version.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy production
    needs: release
    # Never on pull_request / forks. Only a successful version bump on this repo's main.
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'omidz4t/portal' &&
      needs.release.outputs.bumped == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
